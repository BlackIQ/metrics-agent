[project]
name = "openHubble-agent"
version = "2.20.0"
description = "Lightweight system monitoring agent"
authors = ["OpenHubble Team <team@openhubble.com>", "Amirhossein Mohammadi <hi@amirhossein.info>"]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.140.0",
    "psutil>=7.2.2",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "websockets>=16.1.1",
]

[tool.fastapi]
entrypoint = "main:app"
